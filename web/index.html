<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus</title>
  <script>
    // Apply a saved theme before the page draws, so it never flashes the other one
    try {
      var savedTheme = localStorage.getItem("nexus-theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/ask.css">
  <link rel="stylesheet" href="css/sources.css">
  <link rel="stylesheet" href="css/evals.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
          <line x1="7" y1="8" x2="20" y2="6" />
          <line x1="7" y1="8" x2="12" y2="21" />
          <line x1="20" y1="6" x2="12" y2="21" />
          <circle class="node-a" cx="7" cy="8" r="3.5" />
          <circle class="node-b" cx="20" cy="6" r="3.5" />
          <circle class="node-c" cx="12" cy="21" r="3.5" />
        </svg>
        <span>Nexus</span>
      </a>
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
      </div>

      <nav class="nav">
        <a href="#/" data-page="home"><span data-icon="home"></span>All workspaces</a>
      </nav>

      <div class="workspace-block">
        <label class="workspace-picker">
          <span>Workspace</span>
          <select id="workspace-select"></select>
        </label>

        <nav class="nav">
          <a href="#/ask" data-page="ask"><span data-icon="ask"></span>Ask</a>
          <a href="#/sources" data-page="sources"><span data-icon="sources"></span>Sources<span class="nav-count" id="nav-sources-count"></span></a>
          <a href="#/evals" data-page="evals"><span data-icon="evals"></span>Evaluations</a>
        </nav>
      </div>

      <div class="recent" id="recent" hidden>
        <h2>Recent questions</h2>
        <ul id="recent-list"></ul>
      </div>

      <section class="model-panel" aria-label="Model">
        <button type="button" class="button quiet add-key" id="add-key"><span data-icon="key"></span>Add your own API key</button>
        <button type="button" class="model-status" id="model-toggle" aria-expanded="false" aria-controls="model-form">
          <span class="model-dot"></span>
          <span id="model-status-text"></span>
          <span class="model-change">Change</span>
        </button>

        <form class="model-form" id="model-form" hidden>
          <label class="field">
            Provider
            <select id="model-provider"></select>
          </label>
          <label class="field">
            Your API key
            <input id="model-key" type="password" autocomplete="off" spellcheck="false">
          </label>
          <label class="field">
            Model
            <input id="model-name" autocomplete="off" spellcheck="false">
            <small>Leave empty for the default</small>
          </label>
          <p class="model-note">Kept in this tab only and sent with each question. Never saved on the server.</p>
          <div class="model-actions">
            <button class="button" type="submit">Use this key</button>
            <button class="button quiet" type="button" id="model-forget" hidden>Remove</button>
          </div>
        </form>
      </section>
    </aside>

    <main class="main">
      <header class="page-header" id="page-header">
        <p class="breadcrumb"><a href="#/">Workspaces</a></p>
        <h1 id="workspace-name">Loading</h1>
        <p id="workspace-description"></p>
      </header>
      <div id="page"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
